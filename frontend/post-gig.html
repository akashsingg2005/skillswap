<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Post a Gig — SkillSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Fixed Top Navigation Bar -->
  <header class="fixed-header-wrapper">
    <div class="top-gradient-bar"></div>
    <div class="navbar">
      <div class="nav-container">
        <a href="index.html" class="logo">
          <div class="logo-symbol">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 10h14l-4-4"/>
              <path d="M17 14H3l4 4"/>
            </svg>
          </div>
          <div class="logo-text-wrapper">
            <span class="logo-brand-skill">Skill</span><span class="logo-brand-swap">Swap</span>
          </div>
        </a>

        <button class="hamburger" id="hamburger-toggle" aria-label="Toggle Navigation">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>

        <nav>
          <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Browse Marketplace</a></li>
            <li><a href="post-gig.html" class="nav-link active">Post a Gig</a></li>
            <li><a href="bookings.html" class="nav-link">My Bookings</a></li>
            <li><a href="dashboard.html" class="nav-link btn btn-secondary btn-sm">Creator Dashboard</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <main class="main-content" style="max-width: 680px; margin-top: 2rem;">
    <div style="background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 2.25rem; box-shadow: var(--shadow-md);">
      <div style="margin-bottom: 1.75rem;">
        <span style="font-size: 0.8rem; font-weight: 700; color: var(--primary); text-transform: uppercase; letter-spacing: 0.05em; background: var(--primary-light); padding: 0.3rem 0.65rem; border-radius: 4px;">
          Creator Publishing
        </span>
        <h1 style="font-size: 1.85rem; font-weight: 800; margin-top: 0.5rem; margin-bottom: 0.35rem;">Post Your Service Gig</h1>
        <p style="color: var(--text-secondary); font-size: 0.95rem;">List your skills on SkillSwap. Newly created gigs immediately become searchable with SkillMatch ranking.</p>
      </div>

      <form id="post-gig-form">
        <div class="form-group">
          <label class="form-label" for="creatorName">Creator Name *</label>
          <input type="text" id="creatorName" class="form-input" placeholder="e.g. Akash" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="title">Service / Gig Title *</label>
          <input type="text" id="title" class="form-input" placeholder="e.g. Full Stack Website Development" required>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1.25rem;">
          <div class="form-group">
            <label class="form-label" for="category">Category *</label>
            <select id="category" class="form-select" required>
              <option value="">Select Category...</option>
              <option value="Development">Development</option>
              <option value="Design">Design</option>
              <option value="Video Editing">Video Editing</option>
              <option value="Writing">Writing</option>
              <option value="Marketing">Marketing</option>
              <option value="Photography">Photography</option>
              <option value="UI/UX">UI/UX</option>
              <option value="Other">Other</option>
            </select>
          </div>

          <div class="form-group">
            <label class="form-label" for="rate">Gig Rate / Price (₹ INR) *</label>
            <input type="number" id="rate" class="form-input" placeholder="e.g. 2500" min="100" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="skills">Skills & Technologies (comma separated) *</label>
          <input type="text" id="skills" class="form-input" placeholder="e.g. HTML, CSS, JavaScript, Node.js, Express.js" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="description">Detailed Service Description *</label>
          <textarea id="description" class="form-textarea" rows="5" placeholder="Describe what you offer, deliverables, turnaround time, and requirements..." required></textarea>
        </div>

        <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 2rem;">
          <a href="index.html" class="btn btn-secondary">Cancel</a>
          <button type="submit" id="submit-gig-btn" class="btn btn-primary" style="padding-left: 2rem; padding-right: 2rem;">
            🚀 Publish Gig Now
          </button>
        </div>
      </form>
    </div>
  </main>

  <footer>
    <p><strong>SkillSwap</strong> — Creator Gig Marketplace</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.getElementById('post-gig-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-gig-btn');

      const gigData = {
        creatorName: document.getElementById('creatorName').value,
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        rate: document.getElementById('rate').value,
        skills: document.getElementById('skills').value,
        description: document.getElementById('description').value,
      };

      try {
        btn.disabled = true;
        btn.innerText = 'Publishing...';

        const res = await api.createGig(gigData);

        if (res.success) {
          showToast('✓ Gig published successfully!', 'success');
          setTimeout(() => {
            window.location.href = 'index.html';
          }, 1200);
        } else {
          showToast(res.message || 'Failed to post gig', 'danger');
          btn.disabled = false;
          btn.innerText = '🚀 Publish Gig Now';
        }
      } catch (err) {
        showToast('Server error posting gig', 'danger');
        btn.disabled = false;
        btn.innerText = '🚀 Publish Gig Now';
      }
    });
  </script>
</body>
</html>
