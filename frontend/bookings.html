<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Bookings — SkillSwap</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/dashboard.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Fixed Top Navigation Bar -->
  <header class="fixed-header-wrapper">
    <div class="top-gradient-bar"></div>
    <div class="navbar">
      <div class="nav-container">
        <a href="index.html" class="logo">
          <div class="logo-symbol">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M7 10h14l-4-4"/>
              <path d="M17 14H3l4 4"/>
            </svg>
          </div>
          <div class="logo-text-wrapper">
            <span class="logo-brand-skill">Skill</span><span class="logo-brand-swap">Swap</span>
          </div>
        </a>

        <button class="hamburger" id="hamburger-toggle" aria-label="Toggle Navigation">
          <span class="bar"></span>
          <span class="bar"></span>
          <span class="bar"></span>
        </button>

        <nav>
          <ul class="nav-links">
            <li><a href="index.html" class="nav-link">Browse Marketplace</a></li>
            <li><a href="post-gig.html" class="nav-link">Post a Gig</a></li>
            <li><a href="bookings.html" class="nav-link active">My Bookings</a></li>
            <li><a href="dashboard.html" class="nav-link btn btn-secondary btn-sm">Creator Dashboard</a></li>
          </ul>
        </nav>
      </div>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="main-content" style="max-width: 900px; margin-top: 1.5rem;">
    <!-- Page Header Section -->
    <div style="text-align: center; margin-bottom: 2rem;">
      <span style="font-size: 0.8rem; font-weight: 800; color: #4f46e5; text-transform: uppercase; letter-spacing: 0.05em; background: #eef2ff; padding: 0.35rem 0.85rem; border-radius: 9999px;">
        ✨ Client Experience Hub
      </span>
      <h1 style="font-size: 2.25rem; font-weight: 800; margin-top: 0.5rem; margin-bottom: 0.35rem; color: #0f172a;">Track My Bookings</h1>
      <p style="color: var(--text-secondary); font-size: 1rem; max-width: 540px; margin: 0 auto;">
        Enter your email address below to view your booked services, creator responses, and payment status in real time.
      </p>
    </div>

    <!-- Email Search Card Form -->
    <div style="background: #ffffff; border: 1px solid var(--border-color); border-radius: var(--radius-lg); padding: 1.25rem 1.5rem; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.06); margin-bottom: 2.5rem;">
      <form id="bookings-search-form" style="display: flex; gap: 0.75rem; align-items: center; flex-wrap: wrap;">
        <div style="flex: 1; min-width: 260px; position: relative; display: flex; align-items: center;">
          <span style="position: absolute; left: 1rem; font-size: 1.1rem; color: var(--text-muted);">📧</span>
          <input type="email" id="search-email-input" class="form-input" style="padding-left: 2.8rem; height: 48px; font-size: 0.95rem; border-radius: 12px;" placeholder="Enter your client email address..." required>
        </div>
        <button type="submit" class="btn btn-primary" style="height: 48px; padding: 0 1.6rem; border-radius: 12px; font-weight: 700; white-space: nowrap; background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);">
          🔍 Track Bookings
        </button>
      </form>
    </div>

    <!-- Bookings List Container -->
    <div id="my-bookings-container" class="bookings-list">
      <!-- Dynamically populated by dashboard.js -->
    </div>
  </main>

  <footer>
    <p><strong>SkillSwap</strong> — Creator Gig Marketplace</p>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script src="js/payment.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
